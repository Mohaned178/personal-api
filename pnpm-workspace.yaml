packages:
  - apps/*
  - packages/*
  # Throwaway spike prototypes, never shipped (for example Spike A, docs/adr/0002).
  - spikes/*

# Refuse package versions published less than 14 days ago (value is minutes).
minimumReleaseAge: 20160

# Dependency build scripts are blocked unless listed here.
allowBuilds:
  # SWC compiles TypeScript for Vitest (decorator metadata); its install script fetches the native binary.
  "@swc/core": true
  # Optional native add-ons (ssh2/cpu-features via testcontainers' docker client) and
  # esbuild/protobufjs postinstall steps are not needed: esbuild ships its binary as an
  # optional dependency, and the rest have pure-JS fallbacks.
  "cpu-features": false
  "ssh2": false
  "esbuild": false
  "protobufjs": false
  # Telemetry postinstall pulled in by swagger-ui-dist (via @nestjs/swagger); the UI does not need it.
  "@scarf/scarf": false

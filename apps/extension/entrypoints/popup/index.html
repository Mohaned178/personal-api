<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal API</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        width: 20rem;
        margin: 0;
        padding: 0.75rem;
        font: 0.875rem/1.4 system-ui, sans-serif;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1rem;
      }
      #state-view dl,
      #connected-view dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.25rem 0.5rem;
        margin: 0 0 0.75rem;
      }
      #state-view dt,
      #connected-view dt {
        font-weight: 600;
      }
      #state-view dd,
      #connected-view dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        font-weight: 600;
      }
      input {
        padding: 0.375rem 0.5rem;
        font: inherit;
      }
      button {
        align-self: start;
        padding: 0.375rem 0.75rem;
        font: inherit;
        cursor: pointer;
      }
      #open-tab-view p {
        margin: 0 0 0.75rem;
      }
      h2 {
        margin: 0.75rem 0 0.5rem;
        font-size: 0.9rem;
      }
      #allow-list {
        margin: 0 0 0.5rem;
        padding: 0;
        list-style: none;
      }
      #allow-list li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        overflow-wrap: anywhere;
      }
      #allow-list-error {
        min-height: 1.25rem;
        margin: 0.25rem 0 0;
        color: #d13438;
      }
      #status {
        min-height: 1.25rem;
        margin: 0.5rem 0 0;
      }
      #status[data-error="true"] {
        color: #d13438;
      }
      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Personal API</h1>

      <section id="state-view" aria-label="Collection status">
        <dl>
          <dt>Status</dt>
          <dd id="state-status"></dd>
          <dt>Queued</dt>
          <dd id="state-queue-depth"></dd>
          <dt>Last sync</dt>
          <dd id="state-last-sync"></dd>
          <dt>Dropped</dt>
          <dd id="state-dropped"></dd>
        </dl>
        <button id="pause-toggle" type="button" hidden></button>
        <button id="clear-queue" type="button" hidden>Clear local queue</button>
      </section>

      <!-- TEMPORARY allow list editor, replaced by the rule editor in M4-06. -->
      <section id="allow-list-view" aria-label="Allowed domains">
        <h2>Allowed domains</h2>
        <p id="allow-list-empty">Nothing is collected until you add a domain.</p>
        <ul id="allow-list"></ul>
        <form id="allow-list-form">
          <label for="allow-list-input">
            Domain
            <input
              id="allow-list-input"
              type="text"
              autocomplete="off"
              spellcheck="false"
              placeholder="example.com"
            />
          </label>
          <button id="allow-list-add" type="submit">Add</button>
        </form>
        <p id="allow-list-error" role="alert" data-error="true"></p>
      </section>

      <section id="connected-view" aria-label="Connection" hidden>
        <dl>
          <dt>Server</dt>
          <dd id="connected-origin"></dd>
          <dt>Source</dt>
          <dd id="connected-name"></dd>
        </dl>
        <button id="disconnect" type="button">Disconnect</button>
      </section>

      <section id="open-tab-view" aria-label="Connect" hidden>
        <p>
          Connecting opens in a new tab, so the browser's permission prompt cannot close this
          popup halfway through.
        </p>
        <button id="open-tab" type="button">Connect…</button>
      </section>

      <form id="connect-form" hidden>
        <label for="server-url">
          Server URL
          <input
            id="server-url"
            name="serverUrl"
            type="url"
            required
            autocomplete="url"
            placeholder="https://api.example.com"
          />
        </label>
        <label for="pairing-code">
          Pairing code
          <input
            id="pairing-code"
            name="pairingCode"
            type="text"
            required
            autocomplete="off"
            spellcheck="false"
            placeholder="XXXX-XXXX-XXXX-XXXX-XXXX"
          />
        </label>
        <button id="connect" type="submit">Connect</button>
      </form>

      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

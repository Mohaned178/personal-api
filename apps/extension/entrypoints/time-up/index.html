<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Time's up</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        display: grid;
        min-height: 100vh;
        place-items: center;
        font: 1rem/1.5 system-ui, sans-serif;
      }
      main {
        max-width: 28rem;
        padding: 1.5rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.75rem;
      }
      p {
        margin: 0 0 1rem;
        overflow-wrap: anywhere;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        justify-content: center;
      }
      button {
        padding: 0.5rem 1rem;
        font: inherit;
        cursor: pointer;
      }
      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Time's up</h1>
      <p id="summary" aria-live="polite"></p>
      <p id="note" hidden></p>
      <div class="actions">
        <button id="snooze" type="button" hidden>5 more minutes</button>
        <button id="back" type="button" hidden>Go back</button>
        <button id="close" type="button">Close this tab</button>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
